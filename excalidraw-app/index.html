<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>狐涂画板</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="referrer" content="origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fbfaf7" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="狐涂画板" />
    <meta
      name="description"
      content="支持云端持久化、图片附件和多画板管理的手绘风格白板。"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="狐涂画板" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="狐涂画板" />
    <meta
      property="og:description"
      content="支持云端持久化、图片附件和多画板管理的手绘风格白板。"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="狐涂画板" />
    <meta
      property="twitter:description"
      content="支持云端持久化、图片附件和多画板管理的手绘风格白板。"
    />

    <!------------------------------------------------------------------------->
    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script src="/theme-init.js"></script>

    <!-- Excalifont stays local; Xiaolai provides its Chinese fallback. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@chinese-fonts/xiaolai@3.0.0/dist/Xiaolai/result.css"
    />

    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <link rel="icon" href="../public/site-icon-v2.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="../public/site-apple-touch-icon-v2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../public/site-icon-v2-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../public/site-icon-v2-16x16.png" />
    <!-- Keep apple-touch-icon opaque and full-bleed for Safari Favorites.
         The manifest separates rounded any icons from the opaque 1024px
         maskable icon Safari uses for Add to Dock without white padding. -->
    <link rel="manifest" href="../public/site-manifest-v4.webmanifest" />

    <!-- Excalidraw version -->
    <meta name="version" content="{version}" />
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <header>
      <h1 class="visually-hidden">狐涂画板</h1>

    <script type="module" src="index.tsx"></script>
