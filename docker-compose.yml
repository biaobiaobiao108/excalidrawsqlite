services:
  excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_DISABLE_PREVENT_UNLOAD: ${VITE_APP_DISABLE_PREVENT_UNLOAD:-}
    container_name: excalidraw
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DB_PATH: /app/data/excalidraw.db
      FILES_DIR: /app/data/files
      STATIC_DIR: /app/excalidraw-app/build
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # 留空时可与 ALLOW_ANONYMOUS=true 配合使用；服务端负责校验生产配置。
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-false}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
    volumes:
      - ./data:/app/data:Z
