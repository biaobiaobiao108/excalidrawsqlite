services:
  excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidraw
    restart: unless-stopped
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DB_PATH: /app/data/excalidraw.db
      FILES_DIR: /app/data/files
      STATIC_DIR: /app/excalidraw-app/build
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD before starting the container}
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-false}
    volumes:
      - ./data:/app/data:Z
