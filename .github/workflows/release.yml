name: Release & Publish Docker Image

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build, Publish & Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Determine stable release
        id: release_flags
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.release_flags.outputs.latest == 'true' || (github.event_name == 'release' && github.event.release.prerelease == false) }}
            type=sha,format=short

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Release Body
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        id: release_body
        run: |
          TAG_NAME="${{ github.ref_name }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cat << 'EOF' > release_notes.md
          ## 📦 容器镜像已发布 (Container Images)

          本版本的多架构容器镜像（`linux/amd64` 与 `linux/arm64`）已成功构建并发布至 GitHub Packages。

          - **GHCR 镜像地址**: `ghcr.io/$REPO_LOWER:$TAG_NAME` / `ghcr.io/$REPO_LOWER:latest`
          - **全栈轻量架构**: Bun 1.4+ + 原生 SQLite 持久化 + 纯净无广告 UI (镜像体积仅 ~130MB)

          ---

          ## 🚀 部署方法 (Deployment Guide)

          ### 方式一：Docker / Podman 一键运行 (CLI)

          ```bash
          # 1. 创建本地数据持久化目录
          mkdir -p ./data
          # 镜像默认保留 root 运行身份，rootless Podman 会映射到当前用户。
          # 如需非 root 运行，请显式设置 --user UID:GID 并确保目录可写。

          # 2. 启动容器
          docker run -d \
            --name excalidraw \
            --restart unless-stopped \
            -p 8080:8080 \
            -v $(pwd)/data:/app/data:Z \
            -e AUTH_PASSWORD="your-strong-password" \
            -e DB_PATH=/app/data/excalidraw.db \
            -e FILES_DIR=/app/data/files \
            -e STATIC_DIR=/app/excalidraw-app/build \
            ghcr.io/$REPO_LOWER:$TAG_NAME
          ```

          > 生产环境必须设置非空 `AUTH_PASSWORD`；仅可信局域网免密时才显式设置 `ALLOW_ANONYMOUS=true`。

          ---

          ### 方式二：Docker Compose 编排部署 (推荐)

          在服务器创建 `docker-compose.yml` 文件：

          ```yaml
          services:
            excalidraw:
              image: ghcr.io/$REPO_LOWER:$TAG_NAME
              container_name: excalidraw
              restart: unless-stopped
              ports:
                - "8080:8080"
              environment:
                - PORT=8080
                - DB_PATH=/app/data/excalidraw.db
                - FILES_DIR=/app/data/files
                - STATIC_DIR=/app/excalidraw-app/build
                - TRUST_PROXY=false
                - AUTH_PASSWORD=your-strong-password
                - ALLOW_ANONYMOUS=false
              volumes:
                - ./data:/app/data:Z
          ```

          启动服务：
          ```bash
          docker compose up -d
          # Podman：podman compose up -d
          curl http://localhost:8080/api/health
          ```

          ---

          ### 💾 数据持久化与备份
          - 画板元数据和矢量图元结构存储在 `./data/excalidraw.db`，图片附件存储在 `./data/files/`；
          - 备份前先停止容器，再整体复制 `./data` 文件夹，避免复制 WAL 状态下的不一致数据库。
          - `:Z` 用于 SELinux 主机；Docker Desktop 若不接受该后缀可删除它。公网部署必须使用 HTTPS，反向代理场景只有显式设置 `TRUST_PROXY=true` 才会信任 `X-Forwarded-Proto`。
          EOF

          sed -i "s|\$REPO_LOWER|$REPO_LOWER|g" release_notes.md
          sed -i "s|\$TAG_NAME|$TAG_NAME|g" release_notes.md

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release_notes.md
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
